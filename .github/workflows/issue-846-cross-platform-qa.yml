name: Issue 846 cross-platform source verification (temporary fork QA)
on:
  push:
    branches:
      - qa/846-cross-platform-20261116
permissions:
  contents: read
concurrency:
  group: issue846-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: .NET Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify original contributor source SHA
        shell: bash
        run: |
          git show --format=%P -s HEAD
          git diff --exit-code HEAD^ HEAD -- src/VaultSync.Core/Services/BackupService.cs tests/VaultSync.Core.Tests/BackupTopologyMatrix846Tests.cs tests/VaultSync.Core.Tests/BackupTopologyRegression846Tests.cs
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore test dependencies
        run: dotnet restore tests/VaultSync.Core.Tests/VaultSync.Core.Tests.csproj
      - name: Compile Release with warnings as errors
        run: dotnet build tests/VaultSync.Core.Tests/VaultSync.Core.Tests.csproj --configuration Release --no-restore -warnaserror -p:UseSharedCompilation=false -m:1
      - name: Issue 846 targeted regression tests
        run: dotnet test tests/VaultSync.Core.Tests/VaultSync.Core.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~BackupTopologyMatrix846Tests|FullyQualifiedName~BackupTopologyRegression846Tests|FullyQualifiedName~BackupResilienceSupplement846Tests" --logger "trx;LogFileName=issue846.trx"
      - name: All Core regression tests
        run: dotnet test tests/VaultSync.Core.Tests/VaultSync.Core.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=core-all.trx"
      - name: Publish TRX test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue846-trx-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 5
